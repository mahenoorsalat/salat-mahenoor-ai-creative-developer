name: Hourly Search Engine & Traffic Booster Bot

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly every single hour
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  boost-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Hourly Search Engine Traffic Booster Bot
        run: node scripts/auto-traffic-booster.js
